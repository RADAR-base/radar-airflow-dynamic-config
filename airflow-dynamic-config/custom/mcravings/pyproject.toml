[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mcraving"
version = "0.1.0"
description = "MCraving analysis project"
requires-python = ">=3.10"
dependencies = [
    "fastavro>=1.9",
    "numba",
    "numpy",
    "pandas",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]
