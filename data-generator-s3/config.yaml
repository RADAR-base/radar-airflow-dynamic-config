# Kafka Empatica Data Generator Configuration

environment: "testing"

kafka:
  topic: "s3-source-topic"

environments:
  testing:
    kafka:
      bootstrap_servers: "kafka-1:9092,kafka-2:9092,kafka-3:9092"
      schema_registry_url: "http://schema-registry-1:8081"
      topic: "s3-source-topic"

# Generator configurations
generators:
  - data_type: "empatica"
    interval: 60 # Time in seconds between data generation
    enabled: true
    num_participants: 10
    records_per_interval: 3
    participant_prefix: ""
    participant_id_width: 4
    # Length of the sensor session captured in each generated record.
    duration_seconds: 10
    device_model: "EMBRACEPLUS"
    timezone: 3600
    enrollment:
      siteID: "001"
      studyID: "ACRM"
      organizationID: "TSPN"

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
